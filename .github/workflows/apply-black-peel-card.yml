name: Apply Black Peel card

on:
  push:
    branches:
      - feature/protocolos-videos-2026-10-15
    paths:
      - .github/workflows/apply-black-peel-card.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/protocolos-videos-2026-10-15
      - name: Apply bounded card patch
        run: python scripts/apply-black-peel-card.py
      - name: Commit card update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocolos/index.html
          git commit -m "feat: place Black Peel video in Protocolos card"
          git push origin HEAD:feature/protocolos-videos-2026-10-15
