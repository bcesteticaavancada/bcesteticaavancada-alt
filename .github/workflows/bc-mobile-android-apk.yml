name: BC Mobile Android APK (demo)

on:
  push:
    branches: [feature/bc-mobile-native-prototype]
    paths: ['.github/workflows/bc-mobile-android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compile demo APK (no production services)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck app
        run: npm run check
      - name: Test fixture agenda
        run: npm run test:agenda
      - name: Ensure no production services were configured
        run: |
          if rg -n 'service_role|SUPABASE_SERVICE_ROLE|EXPO_PUBLIC_SUPABASE|https?://bcesteticaavancada' App.tsx src; then
            echo 'Unexpected production service in demo build.'
            exit 1
          fi
      - name: Generate temporary Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Compile standalone demo APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
        env:
          CI: '1'
      - name: Validate output and print SHA-256
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK for device tests
        uses: actions/upload-artifact@v4
        with:
          name: bc-estetica-android-demo-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
