name: Agenda DB CI

on:
  push:
    branches:
      - 'feature/public-agenda-native'
    paths:
      - 'supabase/**'
      - 'scripts/prepare-supabase-ci-migrations.py'
      - '.github/workflows/agenda-db-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/prepare-supabase-ci-migrations.py'
      - '.github/workflows/agenda-db-ci.yml'
  workflow_dispatch:

jobs:
  database-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Generate corrective migration name with Supabase CLI
        run: supabase migration new bc_gestao_agenda_v2_permissions

      - name: Show generated corrective migration filename
        run: find supabase/migrations -maxdepth 1 -type f -name '*bc_gestao_agenda_v2_permissions.sql' -printf '%f\n'

      - name: Normalize legacy migration versions for ephemeral CI
        run: python3 scripts/prepare-supabase-ci-migrations.py

      - name: Start ephemeral Supabase
        run: supabase start

      - name: Replay migrations from scratch
        run: supabase db reset

      - name: Run database runtime tests
        run: supabase test db

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
