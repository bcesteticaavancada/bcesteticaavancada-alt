name: Agenda DB CI

on:
  push:
    branches:
      - 'feature/public-agenda-native'
    paths:
      - 'supabase/**'
      - 'scripts/prepare-supabase-ci-migrations.py'
      - 'scripts/test-agenda-concurrency.py'
      - 'scripts/test-finance-concurrency.py'
      - 'scripts/test-finance-simple-concurrency.py'
      - 'scripts/fixtures/**'
      - '.github/workflows/agenda-db-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/prepare-supabase-ci-migrations.py'
      - 'scripts/test-agenda-concurrency.py'
      - 'scripts/test-finance-concurrency.py'
      - 'scripts/test-finance-simple-concurrency.py'
      - 'scripts/fixtures/**'
      - '.github/workflows/agenda-db-ci.yml'
  workflow_dispatch:

jobs:
  database-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2 (Node.js 24 compatible)
        with:
          version: 2.121.0

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Require explicit Data API grants for new objects
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path('supabase/config.toml').read_text())
          assert config['api']['auto_expose_new_tables'] is False
          assert config['db']['major_version'] == 17
          print('Secure replay: no automatic Data API grants; PostgreSQL 17.')
          PY

      - name: Normalize legacy migration versions for ephemeral CI
        run: python3 scripts/prepare-supabase-ci-migrations.py

      - name: Start free ephemeral Supabase database
        run: supabase start --exclude edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector

      - name: Replay migrations without automatic Data API grants
        id: replay
        run: supabase db reset

      - name: Run database runtime tests
        run: supabase test db

      - name: Check database functions
        run: supabase db lint --local --schema public,private --level error --fail-on error

      - name: Local security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on warn

      - name: Concurrent reservations across channels and midnight
        if: ${{ !cancelled() && steps.replay.outcome == 'success' }}
        run: python3 scripts/test-agenda-concurrency.py

      - name: Concurrent financial receipts, reversals and books
        if: ${{ !cancelled() && steps.replay.outcome == 'success' }}
        run: python3 scripts/test-finance-concurrency.py

      - name: Concurrent simple commissions and expenses
        if: ${{ !cancelled() && steps.replay.outcome == 'success' }}
        run: python3 scripts/test-finance-simple-concurrency.py

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup
