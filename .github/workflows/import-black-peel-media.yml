name: Import Black Peel media

on:
  push:
    branches:
      - feature/protocolos-videos-2026-10-15
    paths:
      - .github/workflows/import-black-peel-media.yml

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/protocolos-videos-2026-10-15
      - name: Download optimized Black Peel MP4
        run: |
          mkdir -p assets/procedimentos
          curl --fail --location --retry 3 --silent --show-error \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/374f84ee-2272-47db-aa54-8fb726529663.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDA5NDM0YjU0ZmNkYmYzZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjIzMTIyMX0.Hy5iSRMIF9kbFRrYqVbkfjqBHJdhx-zEWB2pD6DBafg' \
            --output assets/procedimentos/black-peel.mp4
          test "$(wc -c < assets/procedimentos/black-peel.mp4)" -gt 250000
      - name: Commit permanent repository media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/procedimentos/black-peel.mp4
          git commit -m "feat: add optimized Black Peel protocol video"
          git push origin HEAD:feature/protocolos-videos-2026-10-15
