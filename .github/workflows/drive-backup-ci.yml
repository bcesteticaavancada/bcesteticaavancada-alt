name: BC Drive Backup Draft CI
on:
  push:
    branches:
      - 'backup/**'
    paths:
      - 'supabase/functions/drive-backup/**'
      - '.github/workflows/drive-backup-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/drive-backup/**'
      - '.github/workflows/drive-backup-ci.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check backup formatting
        run: deno task --config supabase/functions/drive-backup/deno.json fmt
      - name: Verify backup and recovery using fictional data (network disabled)
        run: deno task --config supabase/functions/drive-backup/deno.json test
      - name: Type-check draft Edge Function
        run: deno task --config supabase/functions/drive-backup/deno.json check
