name: Site CI

on:
  push:
    branches:
      - 'work/**'
      - 'feature/**'
      - main
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'gestao/**'
      - 'supabase/**'
      - 'tests/site/**'
      - 'tests/edge/**'
      - 'scripts/test-agenda-browser.mjs'
      - 'scripts/test-client-registration-browser.mjs'
      - 'scripts/test-simple-dashboard-browser.mjs'
      - 'scripts/test-creation-dashboard-browser.mjs'
      - 'scripts/test-public-navigation-browser.mjs'
      - 'scripts/test-custom-domain-browser.mjs'
      - 'scripts/test-maya-browser.mjs'
      - 'tests/gestao/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'gestao/**'
      - 'supabase/**'
      - 'tests/site/**'
      - 'tests/edge/**'
      - 'scripts/test-agenda-browser.mjs'
      - 'scripts/test-client-registration-browser.mjs'
      - 'scripts/test-simple-dashboard-browser.mjs'
      - 'scripts/test-creation-dashboard-browser.mjs'
      - 'scripts/test-public-navigation-browser.mjs'
      - 'scripts/test-custom-domain-browser.mjs'
      - 'scripts/test-maya-browser.mjs'
      - 'tests/gestao/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install test dependencies
        run: npm ci
      - name: Existing pre-anamnese tests
        run: npm run test:frontend
      - name: Site regression tests
        run: npm run test:site
      - name: BC Gestão tests
        run: npm run test:gestao
      - name: Exact custom-domain CORS and authorization boundaries
        run: deno test --allow-env --allow-read=supabase/functions --config supabase/functions/generate-clinical-pdf/deno.json tests/edge/custom-domain-cors_test.ts
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Custom-domain root and legacy path rehearsal with isolated fixtures
        run: node scripts/test-custom-domain-browser.mjs
      - name: Agenda mobile, tablet and desktop browser tests
        run: node scripts/test-agenda-browser.mjs
      - name: Basic client registration browser tests
        run: node scripts/test-client-registration-browser.mjs
      - name: Simple dashboard phone and tablet browser tests
        run: node scripts/test-simple-dashboard-browser.mjs
      - name: Creation dashboard phone and tablet browser tests
        run: node scripts/test-creation-dashboard-browser.mjs
      - name: Public navigation phone and tablet browser tests
        run: node scripts/test-public-navigation-browser.mjs
      - name: Maya internal browser tests with synthetic profiles
        run: node scripts/test-maya-browser.mjs
      - name: Upload Maya browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maya-browser-screenshots
          path: test-results/maya/
      - name: Upload custom-domain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-domain-browser-screenshots
          path: test-results/custom-domain/
      - name: Upload agenda browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-browser-screenshots
          path: test-results/agenda/
      - name: Upload public navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-navigation-screenshots
          path: test-results/public-navigation/
      - name: Upload creation dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creation-dashboard-screenshots
          path: test-results/creation/
      - name: Public Agenda Edge Function check
        run: deno check --node-modules-dir=auto supabase/functions/public-agenda/index.ts
      - name: Support Edge Function check
        run: deno check --config supabase/functions/client-support/deno.json supabase/functions/client-support/index.ts
      - name: Public Agenda HTTP boundary tests
        run: deno test --allow-env supabase/functions/public-agenda/handler_test.ts
      - name: Anamnese PDF Edge Function tests
        run: deno test --config supabase/functions/generate-anamnese-pdf/deno.json supabase/functions/generate-anamnese-pdf/pdf_test.ts
      - name: Clinical PDF Edge Function tests
        run: deno test --config supabase/functions/generate-clinical-pdf/deno.json supabase/functions/generate-clinical-pdf/pdf_test.ts
