name: Pre-anamnese CI

on:
  push:
    branches:
      - feature/pre-anamnese-native
      - feat/bc-editorial-redesign
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Run site tests when present
        run: npm run test:site --if-present
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Supabase function tests
        run: deno test --config supabase/functions/submit-pre-anamnese/deno.json --allow-env --allow-net supabase/functions/submit-pre-anamnese/*_test.ts
      - name: Generate PDF preview
        if: github.ref == 'refs/heads/feat/bc-editorial-redesign'
        run: deno run --config supabase/functions/submit-pre-anamnese/deno.json --allow-write --allow-net scripts/generate-pre-anamnese-preview.ts
      - name: Upload PDF preview
        if: github.ref == 'refs/heads/feat/bc-editorial-redesign'
        uses: actions/upload-artifact@v4
        with:
          name: pre-anamnese-preview
          path: artifacts/pre-anamnese-preview.pdf
          if-no-files-found: error
